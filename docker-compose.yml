version: '3.9'

services:
  # 1. Layanan Website Aksesoris
  web-aksesoris:
    build: .                         # <-- INI YANG BERUBAH (Memakai Dockerfile)
    container_name: website_aksesoris_virtual
    ports:
      - "8080:80"
    volumes:
      - ./web-aksesoris/:/var/www/html
    restart: always

  # 2. Layanan Database (MySQL)
  db-aksesoris:
    image: mysql:8.0
    container_name: db_aksesoris_virtual
    restart: always
    environment:
      MYSQL_DATABASE: web-aksesoris
      MYSQL_ROOT_PASSWORD: password_kamu
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 3. Layanan Portainer
  portainer:
    image: portainer/portainer-ce:2.33.1
    container_name: portainer_management
    ports:
      - "9443:9443"
      - "8888:8000"
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
  db_data: